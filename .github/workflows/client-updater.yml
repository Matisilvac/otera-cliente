name: Client updater
# Builds bin/otera-updater for Windows and Linux, runs the end-to-end updater
# tests on each (local HTTPS server, signed test releases, tampering, rollback,
# crash recovery) and uploads the production binary with its provenance record.
# Vive aca y no en Matisilvac/otera por lo mismo que client-native.yml: en un
# repo publico los runners son gratis. La copia de alla es la de referencia.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/client-updater.yml
      - client/native/updater/**
      - client/release_manifest.py
      - tests/client_updater.py
permissions:
  contents: read
jobs:
  updater:
    name: Updater ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2025-vs2026
            triplet: x64-windows-static
            binary: otera-updater.exe
          - platform: linux
            runner: ubuntu-24.04
            triplet: x64-linux
            binary: otera-updater
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
    steps:
      - name: Preserve source line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3 # same baseline as the game binaries
          path: vcpkg
          fetch-depth: 0 # manifest mode resolves versions from git history
      - uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: otera-updater-${{ matrix.platform }}-${{ hashFiles('client/native/updater/vcpkg.json') }}-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tools
        shell: bash
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          python -m pip install --quiet cryptography
          if [ "$RUNNER_OS" = "Windows" ]; then ./vcpkg/bootstrap-vcpkg.bat -disableMetrics; else ./vcpkg/bootstrap-vcpkg.sh -disableMetrics; fi
      - name: Build the production updater
        shell: bash
        run: |
          cmake -S client/native/updater -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
          cmake --build build --config Release
      - name: End-to-end updater tests
        shell: bash
        run: |
          python tests/client_updater.py \
            --cmake-arg=-DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            --cmake-arg=-DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}
      - name: Record provenance
        shell: bash
        run: |
          binary=build/${{ matrix.binary }}
          [ -f "$binary" ] || binary=build/Release/${{ matrix.binary }}
          python client/native/updater/provenance.py --platform ${{ matrix.platform }} --binary "$binary" --output artifacts
          # The shipped binary must never be a test build.
          python - <<'PY'
          from pathlib import Path
          data = Path('artifacts/${{ matrix.binary }}').read_bytes()
          assert b'https://github.com/Matisilvac/otera-cliente/releases/' in data and b'https://127.0.0.1' not in data
          PY
          cp vcpkg/LICENSE.txt artifacts/vcpkg-LICENSE.txt
          find build/vcpkg_installed -path '*/share/*/copyright' | sort | while read f; do
            echo "=== $(basename "$(dirname "$f")") ===" >> artifacts/otera-updater-licenses.txt
            cat "$f" >> artifacts/otera-updater-licenses.txt
          done
      - uses: actions/upload-artifact@v4
        with:
          name: otera-updater-${{ matrix.platform }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
